version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: localai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localai_bridge}
      POSTGRES_USER: ${POSTGRES_USER:-localai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localai_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localai} -d ${POSTGRES_DB:-localai_bridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    container_name: localai-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-localai}:${POSTGRES_PASSWORD:-localai_secret}@postgres:5432/${POSTGRES_DB:-localai_bridge}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me}
      DEVICE_SECRET: ${DEVICE_SECRET:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-120000}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-30000}
      HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS:-10000}
    volumes:
      - ./admin:/app/admin:ro

volumes:
  pgdata:
